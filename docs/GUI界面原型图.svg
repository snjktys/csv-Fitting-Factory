<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#254e8a"/>
      <stop offset="1" stop-color="#347c73"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1b2940" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 26px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: white; }
      .menu { font: 500 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #24344d; }
      .section { font: 700 18px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #1e3557; }
      .text { font: 400 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #3d4d64; }
      .small { font: 400 13px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #647287; }
      .button { font: 600 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: white; }
      .input { fill: white; stroke: #bac5d4; stroke-width: 1.5; }
      .panel { fill: white; stroke: #d7dee8; stroke-width: 1.5; }
      .grid { stroke: #e5eaf1; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1500" height="940" fill="#edf2f7"/>
  <g filter="url(#shadow)">
    <rect x="50" y="35" width="1400" height="860" rx="16" fill="#f7f9fc" stroke="#b8c4d3"/>
  </g>
  <path d="M66 35 H1434 Q1450 35 1450 51 V105 H50 V51 Q50 35 66 35" fill="url(#header)"/>
  <text x="85" y="77" class="title">CSV 数据曲线拟合工厂</text>
  <text x="1325" y="76" text-anchor="end" class="button">桌面数据分析工具</text>

  <rect x="50" y="105" width="1400" height="42" fill="#ffffff" stroke="#d7dee8"/>
  <text x="82" y="132" class="menu">文件</text>
  <text x="145" y="132" class="menu">帮助</text>

  <rect x="72" y="168" width="420" height="690" rx="12" class="panel"/>
  <rect x="512" y="168" width="916" height="690" rx="12" class="panel"/>

  <text x="96" y="202" class="section">1  数据文件</text>
  <rect x="96" y="220" width="150" height="42" rx="7" fill="#2e6fbb"/>
  <text x="171" y="247" text-anchor="middle" class="button">打开 CSV</text>
  <text x="263" y="238" class="small">尚未选择文件</text>
  <text x="263" y="258" class="small">编码 / 行列数将在此显示</text>
  <line x1="96" y1="278" x2="468" y2="278" stroke="#dce3ec"/>

  <text x="96" y="310" class="section">2  数据列</text>
  <text x="96" y="344" class="text">X 列</text>
  <rect x="190" y="322" width="278" height="36" rx="6" class="input"/>
  <text x="206" y="345" class="small">请选择...</text>
  <path d="M444 336 l8 8 8-8" fill="none" stroke="#66758a" stroke-width="2"/>
  <text x="96" y="390" class="text">Y 列</text>
  <rect x="190" y="368" width="278" height="36" rx="6" class="input"/>
  <text x="206" y="391" class="small">请选择...</text>
  <path d="M444 382 l8 8 8-8" fill="none" stroke="#66758a" stroke-width="2"/>
  <text x="96" y="436" class="text">误差列</text>
  <rect x="190" y="414" width="278" height="36" rx="6" class="input"/>
  <text x="206" y="437" class="small">无</text>
  <path d="M444 428 l8 8 8-8" fill="none" stroke="#66758a" stroke-width="2"/>
  <line x1="96" y1="470" x2="468" y2="470" stroke="#dce3ec"/>

  <text x="96" y="502" class="section">3  拟合模型与参数</text>
  <text x="96" y="538" class="text">模型</text>
  <rect x="190" y="516" width="278" height="36" rx="6" class="input"/>
  <text x="206" y="539" class="small">多项式 / 指数 / 正弦 / Logistic</text>
  <path d="M444 530 l8 8 8-8" fill="none" stroke="#66758a" stroke-width="2"/>
  <text x="96" y="584" class="text">阶次</text>
  <rect x="190" y="562" width="92" height="36" rx="6" class="input"/>
  <text x="206" y="585" class="small">2</text>
  <text x="300" y="584" class="small">仅多项式显示（1～10）</text>
  <text x="96" y="630" class="text">参数</text>
  <rect x="190" y="608" width="278" height="72" rx="6" class="input"/>
  <text x="206" y="633" class="small">a0: 0.0　a1: 1.0</text>
  <text x="206" y="659" class="small">按所选模型动态生成</text>
  <rect x="96" y="700" width="176" height="42" rx="7" fill="#36877e"/>
  <text x="184" y="727" text-anchor="middle" class="button">智能初值</text>
  <rect x="292" y="700" width="176" height="42" rx="7" fill="#d47b26"/>
  <text x="380" y="727" text-anchor="middle" class="button">开始拟合</text>
  <line x1="96" y1="760" x2="468" y2="760" stroke="#dce3ec"/>

  <text x="96" y="792" class="section">4  拟合结果</text>
  <text x="96" y="824" class="text">R²：--</text>
  <text x="245" y="824" class="text">RMSE：--</text>
  <rect x="344" y="790" width="124" height="42" rx="7" fill="#7d68ae"/>
  <text x="406" y="817" text-anchor="middle" class="button">生成报告</text>

  <text x="542" y="202" class="section">拟合结果图</text>
  <rect x="542" y="220" width="856" height="362" rx="8" fill="#fcfdff" stroke="#cad3df"/>
  <line x1="612" y1="538" x2="1358" y2="538" stroke="#6e7d90" stroke-width="1.7"/>
  <line x1="612" y1="250" x2="612" y2="538" stroke="#6e7d90" stroke-width="1.7"/>
  <line x1="612" y1="466" x2="1358" y2="466" class="grid"/>
  <line x1="612" y1="394" x2="1358" y2="394" class="grid"/>
  <line x1="612" y1="322" x2="1358" y2="322" class="grid"/>
  <path d="M640 496 C760 485 790 430 865 420 C930 410 980 350 1060 340 C1140 330 1180 285 1320 270" fill="none" stroke="#d64d4d" stroke-width="4"/>
  <g fill="#3573c5">
    <circle cx="650" cy="501" r="6"/><circle cx="720" cy="475" r="6"/><circle cx="790" cy="449" r="6"/>
    <circle cx="865" cy="426" r="6"/><circle cx="940" cy="390" r="6"/><circle cx="1010" cy="363" r="6"/>
    <circle cx="1085" cy="344" r="6"/><circle cx="1160" cy="313" r="6"/><circle cx="1240" cy="291" r="6"/><circle cx="1315" cy="275" r="6"/>
  </g>
  <line x1="650" y1="486" x2="650" y2="516" stroke="#3573c5"/><line x1="641" y1="486" x2="659" y2="486" stroke="#3573c5"/><line x1="641" y1="516" x2="659" y2="516" stroke="#3573c5"/>
  <rect x="1165" y="235" width="210" height="62" rx="6" fill="white" stroke="#d5dce6"/>
  <circle cx="1185" cy="256" r="5" fill="#3573c5"/><text x="1200" y="261" class="small">原始数据 / 误差棒</text>
  <line x1="1177" y1="280" x2="1194" y2="280" stroke="#d64d4d" stroke-width="3"/><text x="1200" y="285" class="small">拟合曲线</text>

  <text x="542" y="618" class="section">残差图</text>
  <rect x="542" y="636" width="856" height="194" rx="8" fill="#fcfdff" stroke="#cad3df"/>
  <line x1="612" y1="785" x2="1358" y2="785" stroke="#6e7d90" stroke-width="1.7"/>
  <line x1="612" y1="660" x2="612" y2="785" stroke="#6e7d90" stroke-width="1.7"/>
  <line x1="612" y1="724" x2="1358" y2="724" stroke="#333f50" stroke-dasharray="8 7"/>
  <g fill="#8b63b8">
    <circle cx="650" cy="715" r="5"/><circle cx="720" cy="737" r="5"/><circle cx="790" cy="710" r="5"/>
    <circle cx="865" cy="731" r="5"/><circle cx="940" cy="718" r="5"/><circle cx="1010" cy="741" r="5"/>
    <circle cx="1085" cy="711" r="5"/><circle cx="1160" cy="726" r="5"/><circle cx="1240" cy="716" r="5"/><circle cx="1315" cy="733" r="5"/>
  </g>

  <rect x="50" y="858" width="1400" height="37" rx="0" fill="#e4ebf3"/>
  <circle cx="77" cy="876" r="6" fill="#54a06b"/>
  <text x="94" y="882" class="small">状态：等待导入 CSV 文件</text>
  <text x="1398" y="882" text-anchor="end" class="small">有效数据：--　删除数据：--</text>
</svg>
