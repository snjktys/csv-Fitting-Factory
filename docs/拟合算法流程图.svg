<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fd"/>
      <stop offset="1" stop-color="#edf7f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#23324b" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#53647d"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #182640; }
      .subtitle { font: 400 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #607088; }
      .node-title { font: 700 19px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #1d2d47; }
      .node-text { font: 400 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #46566d; }
      .branch { font: 700 14px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #56667d; }
      .arrow { stroke: #53647d; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .box { fill: white; stroke: #5374ae; stroke-width: 2; }
      .decision { fill: #fff9e9; stroke: #c48a2e; stroke-width: 2; }
      .error { fill: #fff1f1; stroke: #c65656; stroke-width: 2; }
      .success { fill: #edf9f3; stroke: #3e9070; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <text x="600" y="55" text-anchor="middle" class="title">CSV 数据曲线拟合算法流程图</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">覆盖数据清理、智能初值、curve_fit、评价指标、绘图与报告状态</text>

  <g filter="url(#shadow)"><rect x="440" y="115" width="320" height="68" rx="34" class="success"/><text x="600" y="157" text-anchor="middle" class="node-title">开始：用户打开 CSV</text></g>
  <path class="arrow" d="M600 183 L600 225"/>

  <g filter="url(#shadow)"><rect x="395" y="225" width="410" height="82" rx="14" class="box"/><text x="600" y="258" text-anchor="middle" class="node-title">读取 CSV</text><text x="600" y="285" text-anchor="middle" class="node-text">依次尝试 UTF-8-SIG、UTF-8、GB18030</text></g>
  <path class="arrow" d="M600 307 L600 355"/>

  <g filter="url(#shadow)"><polygon points="600,355 785,420 600,485 415,420" class="decision"/><text x="600" y="414" text-anchor="middle" class="node-title">读取成功且至少两列？</text><text x="600" y="440" text-anchor="middle" class="node-text">文件非空、表头可用</text></g>
  <path class="arrow" d="M415 420 L260 420"/><text x="345" y="405" class="branch">否</text>
  <g filter="url(#shadow)"><rect x="45" y="376" width="215" height="88" rx="14" class="error"/><text x="152" y="409" text-anchor="middle" class="node-title">提示读取错误</text><text x="152" y="436" text-anchor="middle" class="node-text">保持程序可继续操作</text></g>
  <path class="arrow" d="M600 485 L600 530"/><text x="620" y="512" class="branch">是</text>

  <g filter="url(#shadow)"><rect x="385" y="530" width="430" height="92" rx="14" class="box"/><text x="600" y="564" text-anchor="middle" class="node-title">选择 X、Y 和误差模式</text><text x="600" y="591" text-anchor="middle" class="node-text">无误差 / CSV误差列 / 统一正数；清洗后按 X 排序</text></g>
  <path class="arrow" d="M600 622 L600 668"/>

  <g filter="url(#shadow)"><polygon points="600,668 790,735 600,802 410,735" class="decision"/><text x="600" y="718" text-anchor="middle" class="node-title">清洗后数据满足模型要求？</text><text x="600" y="746" text-anchor="middle" class="node-text">总点数 &gt; 参数数；唯一 X ≥ 参数数</text><text x="600" y="770" text-anchor="middle" class="node-text">数据范围和误差设置有效</text></g>
  <path class="arrow" d="M410 735 L260 735"/><text x="340" y="720" class="branch">否</text>
  <g filter="url(#shadow)"><rect x="45" y="690" width="215" height="92" rx="14" class="error"/><text x="152" y="724" text-anchor="middle" class="node-title">提示数据问题</text><text x="152" y="751" text-anchor="middle" class="node-text">更换列、补充数据或降低阶次</text></g>
  <path class="arrow" d="M600 802 L600 850"/><text x="620" y="830" class="branch">是</text>

  <g filter="url(#shadow)"><rect x="385" y="850" width="430" height="88" rx="14" class="box"/><text x="600" y="883" text-anchor="middle" class="node-title">选择模型并准备初始参数</text><text x="600" y="910" text-anchor="middle" class="node-text">用户输入，或使用对应模型的智能初值</text></g>
  <path class="arrow" d="M600 938 L600 982"/>

  <g filter="url(#shadow)"><polygon points="600,982 770,1042 600,1102 430,1042" class="decision"/><text x="600" y="1036" text-anchor="middle" class="node-title">参数有效？</text><text x="600" y="1062" text-anchor="middle" class="node-text">数量正确且均为有限数值</text></g>
  <path class="arrow" d="M430 1042 L260 1042"/><text x="350" y="1027" class="branch">否</text>
  <g filter="url(#shadow)"><rect x="45" y="998" width="215" height="88" rx="14" class="error"/><text x="152" y="1031" text-anchor="middle" class="node-title">标出参数错误</text><text x="152" y="1058" text-anchor="middle" class="node-text">返回参数设置区域</text></g>
  <path class="arrow" d="M600 1102 L600 1147"/><text x="620" y="1128" class="branch">是</text>

  <g filter="url(#shadow)"><rect x="385" y="1147" width="430" height="78" rx="14" class="box"/><text x="600" y="1178" text-anchor="middle" class="node-title">调用 scipy.optimize.curve_fit</text><text x="600" y="1204" text-anchor="middle" class="node-text">传入模型、x、y、p0、可选sigma；指数使用安全边界</text></g>
  <path class="arrow" d="M600 1225 L600 1267"/>

  <g filter="url(#shadow)"><polygon points="600,1267 755,1322 600,1377 445,1322" class="decision"/><text x="600" y="1316" text-anchor="middle" class="node-title">拟合成功？</text><text x="600" y="1342" text-anchor="middle" class="node-text">参数有限、预测值可计算</text></g>
  <path class="arrow" d="M445 1322 L270 1322"/><text x="355" y="1307" class="branch">否</text>
  <g filter="url(#shadow)"><rect x="45" y="1278" width="225" height="90" rx="14" class="error"/><text x="157" y="1311" text-anchor="middle" class="node-title">提示拟合失败</text><text x="157" y="1338" text-anchor="middle" class="node-text">建议智能初值或调整参数</text></g>
  <path class="arrow" d="M755 1322 L875 1322"/><text x="808" y="1307" class="branch">是</text>
  <g filter="url(#shadow)"><rect x="875" y="1266" width="280" height="112" rx="14" class="success"/><text x="1015" y="1298" text-anchor="middle" class="node-title">生成 FitResult</text><text x="1015" y="1325" text-anchor="middle" class="node-text">预测值、残差、参数误差</text><text x="1015" y="1351" text-anchor="middle" class="node-text">R²、RMSE、警告</text></g>
  <path class="arrow" d="M1015 1378 L1015 1418"/>
  <g filter="url(#shadow)"><rect x="790" y="1418" width="365" height="60" rx="30" class="success"/><text x="972" y="1455" text-anchor="middle" class="node-title">刷新两子图，并允许导出 TXT 报告</text></g>

  <path d="M152 464 C152 520 305 520 385 565" stroke="#a44d4d" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
  <path d="M152 782 C152 835 310 850 385 888" stroke="#a44d4d" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
  <path d="M152 1086 C152 1120 310 1120 385 1170" stroke="#a44d4d" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
</svg>
