<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8ff"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#22304a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#50627c"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17243b; }
      .subtitle { font: 400 17px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #5b687c; }
      .box-title { font: 700 22px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #17243b; }
      .box-text { font: 400 16px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #43516a; }
      .label { font: 600 15px 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif; fill: #52627a; }
      .arrow { stroke: #50627c; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">CSV 数据曲线拟合工厂 - 系统模块图</text>
  <text x="700" y="88" text-anchor="middle" class="subtitle">界面负责协调，核心计算与输入输出相互解耦</text>

  <g filter="url(#shadow)">
    <rect x="520" y="120" width="360" height="105" rx="18" fill="#ffffff" stroke="#476ecb" stroke-width="2.5"/>
    <text x="700" y="160" text-anchor="middle" class="box-title">GUI 界面模块</text>
    <text x="700" y="190" text-anchor="middle" class="box-text">控件 · 状态管理 · 事件协调 · 中文提示</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="80" y="330" width="270" height="145" rx="18" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
    <text x="215" y="372" text-anchor="middle" class="box-title">文件处理模块</text>
    <text x="215" y="404" text-anchor="middle" class="box-text">编码尝试 · CSV 读取</text>
    <text x="215" y="432" text-anchor="middle" class="box-text">文件信息 · 中文表头</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="400" y="330" width="270" height="145" rx="18" fill="#ffffff" stroke="#2f8f83" stroke-width="2.5"/>
    <text x="535" y="372" text-anchor="middle" class="box-title">数据处理模块</text>
    <text x="535" y="404" text-anchor="middle" class="box-text">列校验 · 数值转换</text>
    <text x="535" y="432" text-anchor="middle" class="box-text">无效行清理 · X 排序</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="730" y="330" width="270" height="145" rx="18" fill="#ffffff" stroke="#c17a24" stroke-width="2.5"/>
    <text x="865" y="372" text-anchor="middle" class="box-title">拟合计算模块</text>
    <text x="865" y="404" text-anchor="middle" class="box-text">智能初值 · curve_fit</text>
    <text x="865" y="432" text-anchor="middle" class="box-text">残差 · R² · RMSE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="330" width="270" height="145" rx="18" fill="#ffffff" stroke="#8a62bf" stroke-width="2.5"/>
    <text x="1185" y="372" text-anchor="middle" class="box-title">模型定义模块</text>
    <text x="1185" y="404" text-anchor="middle" class="box-text">多项式 · 指数</text>
    <text x="1185" y="432" text-anchor="middle" class="box-text">正弦 · Logistic</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="300" y="650" width="320" height="145" rx="18" fill="#ffffff" stroke="#476ecb" stroke-width="2.5"/>
    <text x="460" y="692" text-anchor="middle" class="box-title">可视化模块</text>
    <text x="460" y="724" text-anchor="middle" class="box-text">原始数据 · 误差棒 · 拟合曲线</text>
    <text x="460" y="752" text-anchor="middle" class="box-text">残差图 · Matplotlib 画布</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="650" width="320" height="145" rx="18" fill="#ffffff" stroke="#476ecb" stroke-width="2.5"/>
    <text x="940" y="692" text-anchor="middle" class="box-title">报告生成模块</text>
    <text x="940" y="724" text-anchor="middle" class="box-text">文件信息 · 模型与参数</text>
    <text x="940" y="752" text-anchor="middle" class="box-text">R² · RMSE · UTF-8 TXT</text>
  </g>

  <path class="arrow" d="M610 225 C505 270 330 265 240 330"/>
  <text x="405" y="275" class="label">打开 CSV</text>
  <path class="arrow" d="M655 225 C625 270 570 280 545 330"/>
  <text x="570" y="282" class="label">选择列</text>
  <path class="arrow" d="M745 225 C775 270 835 280 855 330"/>
  <text x="795" y="282" class="label">执行拟合</text>
  <path class="arrow" d="M790 225 C900 270 1070 265 1165 330"/>
  <text x="1000" y="275" class="label">选择模型/参数</text>

  <path class="arrow" d="M350 402 L400 402"/>
  <text x="375" y="390" text-anchor="middle" class="label">DataFrame</text>
  <path class="arrow" d="M670 402 L730 402"/>
  <text x="700" y="390" text-anchor="middle" class="label">x/y/σ</text>
  <path class="arrow" d="M1050 402 L1000 402"/>
  <text x="1025" y="390" text-anchor="middle" class="label">函数</text>

  <path class="arrow" d="M805 475 C700 555 560 565 485 650"/>
  <text x="630" y="570" class="label">FitResult</text>
  <path class="arrow" d="M915 475 C1000 555 985 575 955 650"/>
  <text x="1000" y="570" class="label">FitResult</text>
  <path class="arrow" d="M555 225 C330 285 235 515 300 710"/>
  <text x="230" y="560" class="label">GUI 嵌入画布</text>
  <path class="arrow" d="M845 225 C1070 285 1165 515 1100 710"/>
  <text x="1035" y="560" class="label">GUI 触发保存</text>

  <rect x="460" y="835" width="480" height="38" rx="19" fill="#dfe9ff"/>
  <text x="700" y="860" text-anchor="middle" class="subtitle">所有模块错误统一转换为业务异常，由 GUI 负责提示用户</text>
</svg>
